%,88%,100%{transform:rotate(0)}91%{transform:rotate(-7deg)}94%{transform:rotate(6deg)}97%{transform:rotate(-3deg)}}@media(max-width:540px){#funding-quest .q-top{padding:20px 18px 14px;padding-right:85px}#funding-quest .q-main{padding:0 15px 22px}#funding-quest .q-hero{padding:23px 21px}#funding-quest .q-amount{font-size:48px}#funding-quest .q-title{font-size:18px}#funding-quest .q-wallet{grid-template-columns:repeat(2,1fr);gap:16px}#funding-quest .q-map{padding:18px 12px}#funding-quest .q-level{grid-template-columns:32px 1fr;gap:9px}#funding-quest .q-route{padding-top:30px}#funding-quest .q-node{width:30px;height:30px;font-size:17px}#funding-quest .q-start{gap:10px}#funding-quest .q-traveler{width:34px;height:34px;font-size:21px}#funding-quest summary{padding:15px 12px;gap:8px;min-height:105px;align-items:flex-start}#funding-quest .q-stage-title{font-size:14px}#funding-quest .q-stage-money b{font-size:21px}#funding-quest .q-stage-money{padding-top:20px}#funding-quest .q-fields{grid-template-columns:1fr}#funding-quest .q-details{padding-left:12px;padding-right:12px}#funding-quest .q-demo{font-size:10px}#funding-quest .q-map-heading{gap:7px}#funding-quest .q-caption{font-size:10px}}@media(prefers-reduced-motion:reduce){#funding-quest .q-progress-fill{transition:none}#funding-quest .q-hero:after,#funding-quest .q-traveler,#funding-quest .q-level[data-short=true] .q-node{animation:none}}

<div id="funding-quest" aria-label="クエスト風の資金ロードマップ">
<header class="q-top"><div class="q-logo"><div class="q-emblem" aria-hidden="true">🧭</div><div><div class="q-wordmark">LIFE QUEST</div><div class="q-caption">暮らしを整えて、次の冒険へ。</div></div></div></header>
<div class="q-main">
<div class="q-map-heading"><span class="q-demo" data-demo-label>デモの冒険マップ</span><label class="q-toggle cursor-interaction"><input type="checkbox" data-demo checked>デモ値</label></div>
<section class="q-hero" aria-live="polite"><div class="q-eyebrow">YOUR NEXT CHAPTER · CANADA</div><h2 class="q-title" data-hero-title>次の冒険まで、あと</h2><div class="q-amount-row"><div class="q-amount" data-gap></div><small data-gap-suffix>の資金が必要</small></div><div class="q-progress-head"><span>ゴール資金の確保見込み</span><span data-progress-text></span></div><div class="q-progress-track" role="progressbar" aria-label="ゴール資金の確保見込み" aria-valuemin="0" aria-valuemax="100" data-progress><div class="q-progress-fill" data-fill></div></div><div class="q-risk"><span class="q-risk-tag" data-risk-label>最初の難所</span><span data-risk></span></div></section>
<div class="q-wallet"><div><small>手元資金 <em>仮</em></small><b data-balance-total></b></div><div><small>これからの収入</small><b data-income-total></b></div><div><small>生活費などの支出</small><b data-expense-total></b></div><div><small>クエストの必要額</small><b data-goal-total></b></div></div>
<div class="q-map-heading"><h3>冒険のロードマップ</h3><span class="q-caption" data-stage-count></span></div>
<div class="q-map"><div class="q-start"><div class="q-traveler" aria-hidden="true">🎒</div><div>ここからスタート<small>2026.10.25 · 資金を期限順につなぐ</small></div></div><div data-levels></div></div>
<div class="q-tip">必要額に含む支払いは、生活費などの支出と二重計上しません。</div>
<div class="q-bottom"><span data-data-note>手元資金以外の金額・期限はすべてデモ</span><button type="button" class="cursor-interaction" data-balance-toggle aria-expanded="false">手元資金を調整</button></div>
<div class="q-setting" data-balance-panel hidden><label class="q-field">手元資金（円・試算用）<input type="number" min="0" step="10000" value="300000" data-balance></label></div>
<div class="q-status" role="status" aria-live="polite" data-status>画面内の試算のみ。実際の帳簿への保存・支払いは行いません。</div>
</div></div>
<script>
(()=>{
 const root=document.getElementById('funding-quest');
 const defaults=[{date:'2026.11.30',title:'税金・保険料',icon:'🏡',need:120000,income:800000,expense:230000},{date:'2026.12.31',title:'年末の支払い',icon:'🌲',need:200000,income:800000,expense:230000},{date:'2027.03.15',title:'確定申告・納付',icon:'⛰️',need:450000,income:2000000,expense:580000},{date:'2027.04.30',title:'モロッコ旅行（約2週間）',icon:'🐫',need:520000,income:1200000,expense:350000},{date:'2027.05.31',title:'スペイン旅行（日程未定）',icon:'🌞',need:480000,income:800000,expense:130000},{date:'2027.06.30',title:'東北車中泊（レンタカー）',icon:'🚗',need:220000,income:800000,expense:130000},{date:'2027.07.31',title:'スラバヤ結婚式（約5泊）',icon:'💐',need:300000,income:800000,expense:130000},{date:'2027.08.31',title:'カナダ移住（ビザ次第）',icon:'🍁',need:1180000,income:800000,expense:1570000}];
 let balance=300000,demo=true,items=defaults.map(x=>({...x}));
 const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
 function restore(snapshot){const s=snapshot?.privateContent;if(s?.design!=='quest'||typeof s.demo!=='boolean'||!Number.isFinite(s.balance)||s.balance<0||!Array.isArray(s.items)||s.items.length!==defaults.length)return;balance=s.balance;demo=s.demo;items=defaults.map((d,i)=>({...d,...Object.fromEntries(['need','income','expense'].map(k=>[k,Number.isFinite(s.items[i]?.[k])&&s.items[i][k]>=0?s.items[i][k]:d[k]]))}));}
 restore(window.openai?.widgetState);
 const holder=root.querySelector('[data-levels]');
 defaults.forEach((item,i)=>{const el=document.createElement('div');el.className='q-level';el.dataset.index=i;el.innerHTML=`<div class="q-route"><div class="q-node" aria-hidden="true">${item.icon}</div></div><div class="q-stage"><details><summary class="cursor-interaction"><div><div class="q-stage-date" data-date></div><h3 class="q-stage-title">${item.title}</h3><span class="q-stage-badge" data-badge></span></div><div class="q-stage-money"><small data-money-label></small><b data-money></b></div></summary><div class="q-details"><div class="q-fields"><label class="q-field">この目標の必要額（円）<input type="number" min="0" step="10000" data-key="need" aria-label="${item.title}の必要額"></label><label class="q-field">前の地点からの収入（円）<input type="number" min="0" step="10000" data-key="income" aria-label="${item.title}までの予定収入"></label><label class="q-field">前の地点からの支出（円）<input type="number" min="0" step="10000" data-key="expense" aria-label="${item.title}までの予定支出"></label></div><div class="q-stage-actions"><span data-before></span><button type="button" class="cursor-interaction" data-add-income>収入＋5万円で試算</button></div></div></details></div>`;holder.appendChild(el);});
 function render(){
  root.querySelector('[data-demo]').checked=demo;root.querySelector('[data-balance]').value=balance;
  root.querySelector('[data-balance-total]').textContent=yen(balance);
  const income=items.reduce((a,x)=>a+x.income,0),expense=items.reduce((a,x)=>a+x.expense,0),need=items.reduce((a,x)=>a+x.need,0);
  root.querySelector('[data-income-total]').textContent=demo?'＋'+yen(income):'未確認';root.querySelector('[data-expense-total]').textContent=demo?'−'+yen(expense):'未確認';root.querySelector('[data-goal-total]').textContent=demo?yen(need):'未確認';
  let cash=balance,maxGap=0,first=null,funded=0;
  root.querySelectorAll('.q-level').forEach((el,i)=>{const x=items[i],available=cash+x.income-x.expense;cash=available-x.need;const gap=Math.max(0,-cash);maxGap=Math.max(maxGap,gap);if(gap>0&&!first)first={date:x.date,title:x.title,gap,index:i};if(!gap)funded++;
   el.dataset.short=String(demo&&gap>0);el.querySelector('[data-date]').textContent=demo?'期限 '+x.date:'期限 未確認';el.querySelector('[data-badge]').textContent=!demo?'確認待ち':first?.index===i?'最初に資金が不足':gap>0?'資金を準備しよう':'資金を確保できる見込み';el.querySelector('[data-money-label]').textContent=!demo?'必要額':gap?'この地点で不足':'支払った後の残り';el.querySelector('[data-money]').textContent=demo?yen(gap||cash):'未確認';el.querySelector('[data-before]').textContent=demo?'充てられる資金 '+yen(available):'使える資金は未確認';el.querySelector('[data-add-income]').disabled=!demo;
   el.querySelectorAll('[data-key]').forEach(input=>{input.disabled=!demo;if(document.activeElement!==input)input.value=demo?x[input.dataset.key]:'';});
  });
  root.querySelector('[data-gap]').textContent=demo?yen(maxGap):'未算出';root.querySelector('[data-hero-title]').textContent=!demo?'次の冒険に向けて、情報を集めよう':maxGap?'次の冒険まで、あと':'この計画の資金不足は';root.querySelector('[data-gap-suffix]').textContent=demo&&maxGap?'の資金が必要':'';
  const coverage=need>0?Math.max(0,Math.min(100,(balance+income-expense)/need*100)):100;
  root.querySelector('[data-fill]').style.width=demo?coverage+'%':'0%';root.querySelector('[data-progress]').setAttribute('aria-valuenow',demo?String(Math.round(coverage)):'0');root.querySelector('[data-progress-text]').textContent=demo?Math.round(coverage)+'%':'未確認';
  root.querySelector('[data-risk-label]').textContent=!demo?'確認待ち':first?'最初の難所':'準備の見通し';root.querySelector('[data-risk]').textContent=!demo?'金額・期限の確認からスタート':first?`${first.date} · ${yen(first.gap)}不足`:'すべての期限で資金を確保できる見込み';root.querySelector('[data-stage-count]').textContent=demo?`${funded} / ${items.length} 地点で資金確保の見込み`:'金額と期限を確認待ち';root.querySelector('[data-demo-label]').textContent=demo?'デモの冒険マップ':'実データは未入力';root.querySelector('[data-data-note]').textContent=demo?'手元資金以外の金額・期限はすべてデモ':'未確認の金額を0円として計算しません';
 }
 function save(){window.openai?.setWidgetState?.({modelContent:{design:'クエスト風の資金ロードマップ',balanceAssumption:balance,demoOnly:demo},privateContent:{design:'quest',demo,balance,items:items.map(({need,income,expense})=>({need,income,expense}))}})?.catch(()=>{});}
 root.querySelector('[data-demo]').addEventListener('change',e=>{demo=e.target.checked;render();save();});
 root.querySelector('[data-balance]').addEventListener('input',e=>{if(e.target.value==='')return;const n=Number(e.target.value);if(Number.isFinite(n)&&n>=0){balance=n;render();save();}});
 holder.addEventListener('input',e=>{if(!e.target.matches('[data-key]')||e.target.value==='')return;const n=Number(e.target.value);if(!Number.isFinite(n)||n<0){e.target.setCustomValidity('0以上の金額を入力してください');return;}e.target.setCustomValidity('');const i=Number(e.target.closest('.q-level').dataset.index);items[i][e.target.dataset.key]=n;render();save();});
 holder.addEventListener('click',e=>{const button=e.target.closest('[data-add-income]');if(!button||!demo)return;const i=Number(button.closest('.q-level').dataset.index);items[i].income+=50000;render();save();root.querySelector('[data-status]').textContent=`${items[i].title}までの収入を5万円増やして試算しました。実際の収入登録は行っていません。`;});
 root.querySelector('[data-balance-toggle]').addEventListener('click',e=>{const panel=root.querySelector('[data-balance-panel]');panel.hidden=!panel.hidden;e.currentTarget.setAttribute('aria-expanded',String(!panel.hidden));});
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
 render();
 if(globalThis.Tweak){const look={compact:false};const tweak=new Tweak({container:root,onChange:()=>{root.dataset.compact=String(look.compact);}});tweak.addToggle(look,'compact',{label:'マップをコンパクトに'});}
})();
</script>
