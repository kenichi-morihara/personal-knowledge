<style>
#funding-roadmap{--paper:light-dark(#f5f5ee,#171c1a);--surface:light-dark(#ffffff,#222a26);--ink:light-dark(#19342c,#e4eee7);--sub:light-dark(#5a6f64,#b1c3b6);--line:light-dark(#dbe3d9,#3c4c41);--mint:light-dark(#dfecdf,#2d4335);--alert:light-dark(#a2432e,#ffb19b);--alert-bg:light-dark(#f6e7df,#422c25);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:var(--ink);background:var(--paper);border-radius:24px;max-width:850px;margin:auto;padding:28px;box-sizing:border-box;font-size:14px;line-height:1.6;color-scheme:light dark}
#funding-roadmap *{box-sizing:border-box}#funding-roadmap [hidden]{display:none!important}#funding-roadmap button,#funding-roadmap input{font:inherit;color:inherit}#funding-roadmap button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:9px 14px}#funding-roadmap button:focus-visible,#funding-roadmap summary:focus-visible,#funding-roadmap input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}#funding-roadmap .fr-header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;padding-right:70px}#funding-roadmap .fr-brand{letter-spacing:.14em;font-size:11px;color:var(--sub)}#funding-roadmap h2{margin:4px 0;font-size:24px;font-weight:500;letter-spacing:-.04em}#funding-roadmap h3{font-size:16px;font-weight:500;margin:0}#funding-roadmap .fr-demo{font-size:12px;display:inline-flex;align-items:center;gap:7px;padding:5px 10px;background:var(--mint);border-radius:7px;color:var(--ink)}#funding-roadmap .fr-demo:before{content:'';width:6px;height:6px;background:var(--ink);border-radius:50%}#funding-roadmap .fr-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:22px 0 16px}#funding-roadmap .fr-switch{display:flex;gap:9px;align-items:center;min-height:44px;color:var(--sub);font-size:12px}#funding-roadmap .fr-switch input{width:18px;height:18px;accent-color:var(--ink)}#funding-roadmap .fr-hero{padding:27px 28px;border-radius:18px;background:var(--ink);color:var(--paper);position:relative;overflow:hidden}#funding-roadmap .fr-hero-label{font-size:13px;opacity:.85}#funding-roadmap .fr-big{font-size:clamp(38px,8vw,68px);font-weight:500;letter-spacing:-.065em;line-height:1.3;font-variant-numeric:tabular-nums;margin:7px 0 15px;overflow-wrap:anywhere}#funding-roadmap .fr-big span{font-size:18px;letter-spacing:0;margin-left:10px}#funding-roadmap .fr-risk{border-top:1px solid color-mix(in srgb,var(--paper),transparent 75%);padding-top:15px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:13px}#funding-roadmap .fr-risk strong{font-weight:500}#funding-roadmap .fr-risk .fr-risk-badge{padding:3px 9px;background:color-mix(in srgb,var(--paper),transparent 86%);border-radius:6px;font-size:11px}#funding-roadmap .fr-totals{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:23px 0 30px}#funding-roadmap .fr-total small{display:block;color:var(--sub);font-size:11px}#funding-roadmap .fr-total div{font-size:18px;font-variant-numeric:tabular-nums;margin-top:5px;white-space:nowrap}#funding-roadmap .fr-total em{font-style:normal;font-size:10px;background:var(--mint);border-radius:4px;margin-left:5px;padding:2px 4px}#funding-roadmap .fr-section-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:19px}#funding-roadmap .fr-section-head small{color:var(--sub);font-size:11px}#funding-roadmap .fr-timeline{display:flex;flex-direction:column}#funding-roadmap .fr-now{display:grid;grid-template-columns:80px 23px 1fr;gap:12px;align-items:center;color:var(--sub);font-size:11px;margin-bottom:0}#funding-roadmap .fr-now-dot{width:9px;height:9px;border-radius:50%;background:var(--sub);margin:0 auto}#funding-roadmap .fr-event{display:grid;grid-template-columns:80px 23px 1fr;gap:12px}#funding-roadmap .fr-date{padding-top:22px;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}#funding-roadmap .fr-year{font-size:11px;color:var(--sub);display:block}#funding-roadmap .fr-track{position:relative;display:flex;justify-content:center;padding-top:27px}#funding-roadmap .fr-track:before{position:absolute;content:'';width:1px;background:var(--line);top:0;bottom:0}#funding-roadmap .fr-dot{position:relative;z-index:1;background:var(--paper);border:2px solid var(--ink);width:11px;height:11px;border-radius:50%}#funding-roadmap .fr-event[data-short=true] .fr-dot{border-color:var(--alert);background:var(--alert)}#funding-roadmap .fr-event:last-child .fr-track:before{bottom:calc(100% - 33px)}#funding-roadmap .fr-event-content{padding-top:12px;padding-bottom:5px}#funding-roadmap details{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}#funding-roadmap .fr-event[data-short=true] details{background:var(--alert-bg);border-color:transparent}#funding-roadmap summary{list-style:none;display:flex;justify-content:space-between;gap:16px;padding:18px 20px;align-items:center;min-height:85px}#funding-roadmap summary::-webkit-details-marker{display:none}#funding-roadmap .fr-event-sub{font-size:11px;color:var(--sub);margin-top:3px}#funding-roadmap .fr-event-money{text-align:right;flex-shrink:0}#funding-roadmap .fr-event-money small{display:block;color:var(--sub);font-size:11px}#funding-roadmap .fr-event-money b{font-size:22px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.04em}#funding-roadmap .fr-event[data-short=true] .fr-event-money{color:var(--alert)}#funding-roadmap .fr-first{display:inline-block;font-size:10px;color:var(--alert);margin-left:5px}#funding-roadmap .fr-breakdown{padding:0 20px 18px;border-top:1px solid var(--line)}#funding-roadmap .fr-edit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}#funding-roadmap .fr-edit-grid label,#funding-roadmap .fr-settings label{font-size:11px;color:var(--sub)}#funding-roadmap input[type=number]{display:block;width:100%;min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px;margin-top:6px;min-height:44px;font-size:16px;font-variant-numeric:tabular-nums}#funding-roadmap .fr-running{display:flex;justify-content:space-between;margin-top:13px;font-size:12px;color:var(--sub);gap:10px;flex-wrap:wrap}#funding-roadmap .fr-running b{font-weight:500;color:var(--ink)}#funding-roadmap .fr-note{color:var(--sub);font-size:11px;margin-top:19px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#funding-roadmap .fr-settings{padding:17px 0;display:grid;grid-template-columns:1fr 1fr;gap:16px}#funding-roadmap .fr-settings input{max-width:230px}#funding-roadmap .fr-settings small{align-self:center;color:var(--sub);font-size:11px}#funding-roadmap .fr-foot{margin-top:24px;padding-top:15px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--sub)}
@media(max-width:520px){#funding-roadmap{padding:20px 15px;border-radius:18px}#funding-roadmap .fr-header{padding-right:65px}#funding-roadmap h2{font-size:21px}#funding-roadmap .fr-hero{padding:23px 21px}#funding-roadmap .fr-totals{grid-template-columns:repeat(2,1fr);gap:18px}#funding-roadmap .fr-now,#funding-roadmap .fr-event{grid-template-columns:48px 15px 1fr;gap:7px}#funding-roadmap summary{padding:15px 13px;gap:8px;align-items:flex-start}#funding-roadmap .fr-event-money b{font-size:20px}#funding-roadmap .fr-event-sub{max-width:110px}#funding-roadmap .fr-edit-grid{grid-template-columns:1fr}#funding-roadmap .fr-date{font-size:12px}#funding-roadmap .fr-breakdown{padding:0 13px 15px}#funding-roadmap .fr-settings{grid-template-columns:1fr}#funding-roadmap .fr-section-head{align-items:flex-start}#funding-roadmap .fr-big{font-size:46px}}
</style>
<div id="funding-roadmap" aria-label="資金ロードマップの画面案">
 <header class="fr-header"><div><div class="fr-brand">PERSONAL KNOWLEDGE</div><h2>お金のロードマップ</h2></div></header>
 <div class="fr-toolbar"><span class="fr-demo" data-demo-badge>画面確認用のデモ</span><label class="fr-switch cursor-interaction"><input type="checkbox" data-demo checked>デモ値を表示</label></div>
 <section class="fr-hero" aria-live="polite"><div class="fr-hero-label" data-head-label>この計画で、あと必要なお金</div><div class="fr-big" data-total-gap></div><div class="fr-risk" data-risk></div></section>
 <div class="fr-totals"><div class="fr-total"><small>スタートの残高<em>仮</em></small><div data-start></div></div><div class="fr-total"><small>予定収入</small><div data-in></div></div><div class="fr-total"><small>予定支出</small><div data-out></div></div><div class="fr-total"><small>目標の必要額</small><div data-goals></div></div></div>
 <div class="fr-section-head"><h3>期限までの見通し</h3><small>各項目を開くと金額を調整できます</small></div>
 <div class="fr-timeline"><div class="fr-now"><span>いま</span><span class="fr-now-dot"></span><span>2026.10.25 · 残高30万円から試算</span></div><div data-events></div></div>
 <div class="fr-note"><span>予定支出：生活費など、目標額と重複しない支出</span><span data-known-note>残高以外の金額・期限はすべてデモ</span></div>
 <footer class="fr-foot"><span>試算条件</span><button type="button" class="cursor-interaction" data-settings aria-expanded="false">仮残高を調整</button></footer>
 <div class="fr-settings" data-setting-panel hidden><label>スタートの残高（円）<input type="number" min="0" step="10000" value="300000" data-balance></label><small>試算用。実際の銀行残高や帳簿には保存しません。</small></div>
</div>
<script>
(()=>{
 const root=document.getElementById('funding-roadmap');
 const initial=[{date:'11.30',year:'2026',title:'税金・保険料',sub:'納付期限まで',need:120000,income:800000,expense:230000},{date:'12.31',year:'2026',title:'年末の支払い',sub:'税金・保険料',need:200000,income:800000,expense:230000},{date:'03.15',year:'2027',title:'確定申告・納付',sub:'期限は仮設定',need:450000,income:2000000,expense:580000},{date:'04.30',year:'2027',title:'モロッコ旅行',sub:'約2週間・日程は仮',need:520000,income:1200000,expense:350000},{date:'05.31',year:'2027',title:'スペイン旅行',sub:'モロッコの後・日程未定',need:480000,income:800000,expense:130000},{date:'06.30',year:'2027',title:'東北車中泊',sub:'レンタカー・日程未定',need:220000,income:800000,expense:130000},{date:'07.31',year:'2027',title:'スラバヤ結婚式',sub:'約5泊・アルフィン',need:300000,income:800000,expense:130000},{date:'08.31',year:'2027',title:'カナダ移住',sub:'ビザ次第・3ヶ月で仕事',need:1180000,income:800000,expense:1570000}];
 let demo=true,balance=300000,items=initial.map(x=>({...x}));
 const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');
 const saved=window.openai?.widgetState;
 function restore(s){const p=s?.privateContent;if(p&&typeof p.demo==='boolean'&&Number.isFinite(p.balance)&&p.balance>=0&&Array.isArray(p.items)&&p.items.length===initial.length){demo=p.demo;balance=p.balance;items=initial.map((v,i)=>({...v,...Object.fromEntries(['need','income','expense'].map(k=>[k,Number.isFinite(p.items[i][k])&&p.items[i][k]>=0?p.items[i][k]:v[k]]))}));}}
 restore(saved);
 const holder=root.querySelector('[data-events]');
 initial.forEach((item,i)=>{const el=document.createElement('div');el.className='fr-event';el.dataset.index=i;el.innerHTML=`<div class="fr-date"><span class="fr-year">${item.year}</span><span data-date>${item.date}</span></div><div class="fr-track"><span class="fr-dot"></span></div><div class="fr-event-content"><details><summary class="cursor-interaction"><div><h3>${item.title}</h3><div class="fr-event-sub" data-sub></div></div><div class="fr-event-money"><small data-money-label></small><b data-money></b></div></summary><div class="fr-breakdown"><div class="fr-edit-grid"><label>目標の必要額（円）<input type="number" min="0" step="10000" data-key="need" aria-label="${item.title}の必要額"></label><label>前の期限からの収入（円）<input type="number" min="0" step="10000" data-key="income" aria-label="${item.title}までの予定収入"></label><label>前の期限からの支出（円）<input type="number" min="0" step="10000" data-key="expense" aria-label="${item.title}までの予定支出"></label></div><div class="fr-running"><span data-available></span><span data-after></span></div></div></details></div>`;holder.appendChild(el);});
 function render(){
 root.querySelector('[data-demo]').checked=demo;root.querySelector('[data-balance]').value=balance;root.querySelector('[data-start]').textContent=yen(balance);
 root.querySelector('[data-demo-badge]').textContent=demo?'画面確認用のデモ':'実データは未入力';
 root.querySelector('[data-in]').textContent=demo?'＋'+yen(items.reduce((s,x)=>s+x.income,0)):'未確認';root.querySelector('[data-out]').textContent=demo?'−'+yen(items.reduce((s,x)=>s+x.expense,0)):'未確認';root.querySelector('[data-goals]').textContent=demo?yen(items.reduce((s,x)=>s+x.need,0)):'未確認';
 let cash=balance,maxGap=0,first=null;
 root.querySelectorAll('.fr-event').forEach((el,i)=>{const x=items[i],available=cash+x.income-x.expense;cash=available-x.need;const gap=Math.max(0,-cash);maxGap=Math.max(maxGap,gap);if(gap>0&&!first)first={...x,gap};const isFirst=first?.title===x.title;
 el.dataset.short=String(demo&&gap>0);el.querySelector('[data-date]').textContent=demo?x.date:'未定';el.querySelector('[data-sub]').textContent=demo?x.sub:'金額・期限は未確認';el.querySelector('[data-money-label]').textContent=!demo?'必要額':gap>0?'この期限で不足':'支払い後に残る';el.querySelector('[data-money]').textContent=demo?yen(gap>0?gap:cash):'未確認';
 el.querySelector('h3').textContent=x.title; if(demo&&isFirst){const b=document.createElement('span');b.className='fr-first';b.textContent='初回不足';el.querySelector('h3').appendChild(b);}
 el.querySelector('[data-available]').textContent=demo?'必要額に充てる資金 '+yen(available):'充てる資金：未確認';el.querySelector('[data-after]').textContent=demo?'必要額 '+yen(x.need):'必要額：未確認';el.querySelectorAll('[data-key]').forEach(input=>{input.disabled=!demo;if(document.activeElement!==input)input.value=demo?x[input.dataset.key]:'';});
 });
 root.querySelector('[data-total-gap]').textContent=!demo?'未算出':yen(maxGap);
 root.querySelector('[data-head-label]').textContent=!demo?'必要額・予定収入・予定支出を確認待ち':maxGap>0?'この計画で、あと必要なお金':'この計画の不足額';
 const risk=root.querySelector('[data-risk]');risk.replaceChildren();const badge=document.createElement('span');badge.className='fr-risk-badge';badge.textContent=!demo?'確認待ち':first?'最初に不足':'見通し';const detail=document.createElement('span');detail.textContent=!demo?'未確認の金額を0円として計算しません':first?`${first.year}.${first.date}　${yen(first.gap)}不足`:'すべての期限で資金を確保できる見込み';risk.append(badge,detail);
 root.querySelector('[data-known-note]').textContent=demo?'残高以外の金額・期限はすべてデモ':'期限・収入・支出は登録待ち';
 }
 function save(){window.openai?.setWidgetState?.({modelContent:{design:'資金ロードマップ',balanceAssumption:balance,demoOnly:demo},privateContent:{demo,balance,items:items.map(({need,income,expense})=>({need,income,expense}))}})?.catch(()=>{});}
 root.querySelector('[data-demo]').addEventListener('change',e=>{demo=e.target.checked;render();save();});
 holder.addEventListener('input',e=>{if(!e.target.matches('[data-key]'))return;const val=Number(e.target.value);if(!Number.isFinite(val)||val<0){e.target.setCustomValidity('0以上の金額を入力してください');return;}e.target.setCustomValidity('');items[Number(e.target.closest('.fr-event').dataset.index)][e.target.dataset.key]=val;render();save();});
 root.querySelector('[data-balance]').addEventListener('input',e=>{const n=Number(e.target.value);if(Number.isFinite(n)&&n>=0){balance=n;render();save();}});
 root.querySelector('[data-settings]').addEventListener('click',e=>{const panel=root.querySelector('[data-setting-panel]');panel.hidden=!panel.hidden;e.currentTarget.setAttribute('aria-expanded',String(!panel.hidden));});
 window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
 render();
 if(globalThis.Tweak){const look={compact:false};const tweak=new Tweak({container:root,onChange:()=>{root.querySelectorAll('summary').forEach(el=>{el.style.minHeight=look.compact?'70px':'';});}});tweak.addToggle(look,'compact',{label:'ロードマップをコンパクトに'});}
})();
</script>
